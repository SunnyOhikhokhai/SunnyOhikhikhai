[project]
name = "nipam-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B008", "B904", "UP007"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the library.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
